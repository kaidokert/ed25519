name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 06:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy, llvm-tools-preview
    - uses: pre-commit/action@v3.0.1

  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Format check
      run: cargo fmt -p ed25519_heapless -- --check

    - name: Clippy
      run: cargo clippy -p ed25519_heapless -- -D warnings

    - name: Build
      run: cargo build -p ed25519_heapless --verbose

    - name: Run tests
      run: cargo test -p ed25519_heapless --verbose

    - name: Test with fixed-bigint (integration tests)
      run: cargo test -p ed25519_heapless --features fixed-bigint --verbose

    - name: Build for no_std
      run: cargo build -p ed25519_heapless --no-default-features

    - name: Run verify_baked
      run: |
        set -o pipefail
        cargo run -p ed25519_heapless --bin verify_baked --features fixed-bigint 2>&1 | tee /tmp/verify_output.txt
        grep -q "ACCEPT" /tmp/verify_output.txt
