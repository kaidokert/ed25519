name: CT-verify

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  panic-free-audit:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.86.0
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabi
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Install krabi-caliper
        run: cargo install krabi-caliper --version 0.1.0 --features cli,campaign
      - name: Panic-free audit (${{ matrix.target }})
        run: |
          cargo krabi-caliper panic-audit \
            --workspace ct-verify \
            --package panic-free-audit \
            --target ${{ matrix.target }} \
            --features panic-handler \
            --negative-features neg-controls \
            --owned-symbol 'panic_audit__|ed25519_heapless::' \
            --expect-negative panic_audit__neg__bounds_check \
            --expect-negative panic_audit__neg__unwrap \
            --expect-negative panic_audit__neg__expect \
            --json target/panic-audit/${{ matrix.target }}.json
      - name: Build ladder-branches
        working-directory: ct-verify
        run: cargo build --release -p ladder-branches
      - name: Ladder-branch calibration (${{ matrix.target }})
        # No `--skip-build`: panic-free-audit's check.sh leaves the
        # archive in the `--features neg-controls` state; force a
        # fresh positive-mode rebuild before disassembly. Cargo cache
        # makes this near-instant.
        working-directory: ct-verify
        run: target/release/ladder-branches ${{ matrix.target }}

  # 64-bit host ISAs get the ladder-branch gate but not the panic-audit
  # gate: the panic-audit negative controls are deliberate bounds/unwrap/
  # expect panics that a 32-bit embedded lowering keeps as owned symbols,
  # but 64-bit codegen folds them away, so the controls can't self-verify
  # there. The ladder driver cross-builds both targets from any host and
  # disassembles the archive, so one x86_64 runner covers both.
  ladder-host-arches:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.86.0
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-none
          - x86_64-unknown-none
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.86
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Build ladder-branches
        working-directory: ct-verify
        run: cargo build --release -p ladder-branches
      - name: Ladder-branch calibration (${{ matrix.target }})
        working-directory: ct-verify
        run: target/release/ladder-branches ${{ matrix.target }}

  ct-ctgrind:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      - name: Build ct-ctgrind
        working-directory: ct-verify
        run: cargo build --release -p ct-ctgrind
      - name: Run under valgrind (${{ matrix.arch }})
        working-directory: ct-verify
        run: valgrind --tool=memcheck --error-limit=no --error-exitcode=0 -q target/release/ct-ctgrind
