name: CT-verify

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  panic-free-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - thumbv7em-none-eabi
          - riscv32imc-unknown-none-elf
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: llvm-tools-preview
      - name: Panic-free audit (${{ matrix.target }})
        run: ct-verify/panic-free-audit/check.sh ${{ matrix.target }}
