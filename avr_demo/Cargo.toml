cargo-features = ["profile-rustflags"]

[package]
name = "avr_demo"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
baseline = []

[dependencies]
avr-device = { version = "0.7", features = ["atmega2560", "rt"] }
krabi-caliper = { version = "0.1.0", features = ["stack", "avr", "ufmt"] }
ed25519_heapless = { path = "../ed25519", default-features = false, features = ["fixed-bigint", "fixed-bigint-u8", "sha512-hmac-sha512"] }
fixed-bigint = { version = "0.5", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
const-num-traits = { version = "0.2", default-features = false }
ufmt = { version = "0.2" }

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "ravedude-0.2.0"
features = ["arduino-mega2560"]

[profile.dev]
panic = "abort"
lto = "fat"
opt-level = "z"

codegen-units = 1
strip = "none"
debug = "full"
rustflags = ["-Z", "ub-checks=no"]

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[patch.crates-io]
krabi-caliper = { path = "../../krabi-caliper" }
