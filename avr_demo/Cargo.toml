cargo-features = ["profile-rustflags"]

[package]
name = "avr_demo"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
baseline = []

[dependencies]
ed25519_heapless = { path = "../ed25519", default-features = false, features = ["fixed-bigint", "fixed-bigint-u8", "sha512-hmac-sha512"] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
const-num-traits = { version = "0.2.1", default-features = false, features = ["ct"] }
ufmt = { version = "0.2" }

[dependencies.arduino-hal]
git = "https://github.com/rahix/avr-hal"
rev = "ravedude-0.2.0"
features = ["arduino-mega2560"]

[profile.dev]
panic = "abort"
lto = "fat"
opt-level = "z"
codegen-units = 1
strip = "none"
debug = "full"
rustflags = ["-Z", "ub-checks=no"]

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "z"

# Experimental: ed25519_heapless (path dep) uses SchoolbookFieldRef from
# modmath v0.6.1-alpha.1; this excluded crate needs its own patch.
[patch.crates-io]
modmath = { git = "https://github.com/kaidokert/modmath-rs.git", tag = "v0.6.1-alpha.1" }
