[package]
name = "ed25519"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std=[]

[dependencies]
num-traits = { version = "0.2.18", default-features = false }
# lazy_static depends on spin, which has "portable_atomic" < i need to pull this
lazy_static = { version = "1.4.0", default-features = false, features = ["spin_no_std"] }
rand = { version = "0.9", default-features = false }
sha2 = { version = "=0.11.0-pre.4", default-features = false, features = ["oid"] }
# sha2 = { version = "0.10.8", default-features = false }
fixed-bigint = { version = "0.1.14", features=["use-unsafe"]}
modmath = { version = "0.1.0", default-features = false }

[dev-dependencies]
# intentionally empty

[[bin]]
name = "keygen"
required-features = ["thread_rng"]
