[package]
name = "ed25519_heapless"
version = "0.5.0-alpha.0"
edition = "2024"
rust-version = "1.86"
description = "Ed25519 signature verification and X25519 key exchange, generic over bigint backends"
license = "GPL-3.0-only"
repository = "https://github.com/kaidokert/ed25519"
readme = "../README.md"
keywords = ["ed25519", "x25519", "curve25519", "no_std", "embedded"]
categories = ["cryptography", "no-std", "no-std::no-alloc"]

[dependencies]
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }
modmath = { version = "0.6.0-alpha.cios.5", features = ["zeroize"] }
# Direct git dep for the runtime-length feature which isn't on crates.io yet.
fixed-bigint = { git = "https://github.com/kaidokert/fixed-bigint-rs", tag = "v0.6.0-alpha.17", default-features = false, features = ["use-unsafe", "zeroize", "cios", "heapless-runtime-len"], optional = true }
subtle = { version = "2.6", default-features = false }
const-num-traits = { version = "0.2.1-alpha.1", default-features = false }
zeroize = { version = "1.8", default-features = false }
hmac-sha512 = { version = "1", default-features = false, features = ["opt_size"], optional = true }
sha2 = { version = "0.11", default-features = false, optional = true }
signature = { version = "3.0", default-features = false }
rand_core = { version = "0.10", default-features = false }

[dev-dependencies]
wycheproof = { version = "0.6", default-features = false, features = ["xdh", "eddsa"] }
rand_chacha = { version = "0.10", default-features = false }
static_assertions = "1"

[features]
default = ["std", "sha512-hmac-sha512"]
std = ["log", "env_logger"]
defmt = []
fixed-bigint = ["dep:fixed-bigint"]
fixed-bigint-u64 = ["fixed-bigint"]
fixed-bigint-256 = ["fixed-bigint"]
fixed-bigint-u8 = ["fixed-bigint"]
# SHA-512 backend selection (pick exactly one). hmac-sha512 is the standalone
# default (~1.6 KiB, no RustCrypto deps). sha2 reuses the RustCrypto
# digest/generic-array machinery — pick it when the consumer already links
# sha2 for SHA-256. Size-sensitive targets picking `sha512-sha2` should set
# `--cfg sha2_backend_soft="compact"` in rustflags — without it the
# non-compact soft backend adds ~6.5 KiB of `.text`.
sha512-hmac-sha512 = ["dep:hmac-sha512"]
sha512-sha2 = ["dep:sha2"]

[[bin]]
name = "verify_baked"
required-features = ["fixed-bigint", "sha512-hmac-sha512"]

[[bin]]
name = "verify"
required-features = ["fixed-bigint", "sha512-hmac-sha512"]

[[bin]]
name = "sign"

[[bin]]
name = "keygen"
