[package]
name = "riscv_demo"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
baseline = []

[dependencies]
riscv-rt = "0.13"

ed25519_heapless = { path = "../ed25519", default-features = false, features = [
    "fixed-bigint",
    "fixed-bigint-u8",
    "sha512-hmac-sha512",
] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
const-num-traits = { version = "0.2.1", default-features = false, features = ["ct"] }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

# modmath is unpublished; ed25519_heapless pulls it by version, and this
# crate is excluded from the root workspace so the root patch doesn't reach
# it. Mirror the git pin here. Drop once modmath ships to crates.io.
[patch.crates-io]
modmath = { git = "https://github.com/kaidokert/modmath-rs.git", tag = "v0.6.0-alpha.cios.36" }
modmath-cios = { git = "https://github.com/kaidokert/modmath-rs.git", tag = "v0.6.0-alpha.cios.36" }
