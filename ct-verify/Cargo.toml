[workspace]
resolver = "2"

members = [ "panic-free-audit", "ct-ctgrind", "ladder-branches" ]
default-members = [ "panic-free-audit", "ct-ctgrind", "ladder-branches" ]

# Pinned release codegen for the CT-verification gate. The taint
# verifier and the asm-grep driver must inspect deployment-shaped
# code (fat LTO inlines every helper into its call site, matching
# what a downstream release build sees), and deterministic output
# means a toolchain bump that perturbs codegen shows up as an
# explicit, reviewable delta rather than silent drift.
#
# Kept in a nested workspace so it doesn't leak into the main crate's
# own `--release` builds — downstream consumers of ed25519_heapless
# pick their own release profile without inheriting this one.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
# Line tables (not full DWARF) don't perturb codegen and let Valgrind
# resolve taint violations to source lines instead of bare symbols.
debug = "line-tables-only"
overflow-checks = false
incremental = false

[patch.crates-io]
krabi-caliper = { git = "https://github.com/kaidokert/krabi-caliper-rs", tag = "v0.1.0-alpha.2" }
