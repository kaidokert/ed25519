[package]
name = "panic-free-audit"
version = "0.0.0"
edition = "2024"
rust-version = "1.86"
publish = false
description = "Linker-DCE audit: confirm ed25519_heapless's sign / verify / x25519 surface synthesizes no panic symbols."

[lib]
# staticlib so a cross-target build produces a `.a` that llvm-nm can
# read without needing a linker script or runtime.
crate-type = ["staticlib"]

[features]
default = []
# Enabled by the shared panic-audit command for the cross-built staticlib. When
# off, the host build links std (workspace clippy / cargo check) which
# supplies its own panic handler.
panic-handler = []
# Turn on the deliberately-panicky `panic_audit__neg__*` fixtures so
# the harness self-test can assert they DO trip. Off in the positive
# pass; on in the negative pass driven by krabi-caliper. If a negative
# fixture ever fails to trip, either the fixture stopped being panicky
# or the walker regex is broken.
neg-controls = []

[dependencies]
ed25519_heapless = { path = "../../ed25519", default-features = false, features = ["sha512-hmac-sha512"] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
const-num-traits = { version = "0.2.1", default-features = false, features = ["ct"] }

# Workspace `[profile.release]` (lto=fat, codegen-units=1, opt-level=z,
# panic=abort) is what makes DCE worth measuring; do not override here.
