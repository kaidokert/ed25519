[package]
name = "cyccnt-hardware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# Exactly one carrier and one fixture must be active (const asserts in main.rs).
# The default lets a bare `cargo run` build; the campaign passes
# `--no-default-features` plus one explicit carrier + fixture per attachment, so
# the per-chunk builds never collide.
default = ["carrier-u32x8", "fix-sign"]
carrier-u32x8 = []
carrier-u32x16 = []
carrier-u8x32 = []
fix-keygen = []
fix-sign = []
fix-x25519 = []
fix-x25519-base = []

[dependencies]
const-num-traits = { version = "0.2", default-features = false }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4xx-hal = { version = "0.22", features = ["stm32f407"] }
ed25519_heapless = { path = "../../ed25519", default-features = false, features = ["fixed-bigint", "fixed-bigint-u8", "sha512-hmac-sha512"] }
krabi-caliper = { version = "0.1", features = ["cortex-m-dwt", "paired", "rtt"] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
