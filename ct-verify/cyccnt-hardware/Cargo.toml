[package]
name = "cyccnt-hardware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
carrier-u32x8 = []
carrier-u32x16 = []
carrier-u8x32 = []

[dependencies]
const-num-traits = { version = "0.2", default-features = false }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
ed25519_heapless = { path = "../../ed25519", default-features = false, features = ["fixed-bigint", "fixed-bigint-u8", "sha512-hmac-sha512"] }
embedded-measure = { version = "0.1", features = ["cortex-m", "paired", "rtt"] }
fixed-bigint = { version = "0.5", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
