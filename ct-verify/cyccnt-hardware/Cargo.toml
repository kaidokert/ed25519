[package]
name = "cyccnt-hardware"
version = "0.1.0"
edition = "2024"
publish = false

[features]
# One carrier must be active (enforced by a const assert in main.rs). A default
# lets a bare `cargo run` build; the campaign passes `--no-default-features`
# plus one explicit carrier, so multi-carrier case-sets never collide.
default = ["carrier-u32x8"]
carrier-u32x8 = []
carrier-u32x16 = []
carrier-u8x32 = []

[dependencies]
const-num-traits = { version = "0.2", default-features = false }
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
stm32f4xx-hal = { version = "0.22", features = ["stm32f407"] }
ed25519_heapless = { path = "../../ed25519", default-features = false, features = ["fixed-bigint", "fixed-bigint-u8", "sha512-hmac-sha512"] }
krabi-caliper = { version = "0.1", features = ["cortex-m-dwt", "paired", "rtt"] }
fixed-bigint = { version = "0.6.0", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
