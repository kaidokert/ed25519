[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
# The campaign supplies the probe selector from KRABI_PROBE. Plain `cargo run`
# intentionally relies on probe-rs auto-detection for local, single-probe use.
# The campaign flashes, resets and attaches as separate steps; this one-shot
# runner is for local use.
runner = "probe-rs run --chip STM32F407VGTx --protocol swd --connect-under-reset"
