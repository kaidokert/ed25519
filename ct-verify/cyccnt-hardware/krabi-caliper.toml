[profiles.jtrace-f407]
runner = "command"
target = "thumbv7em-none-eabihf"
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 30000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  # Attach with the target held in reset so each chunk starts from a clean core
  # state; attaching to still-running firmware from the previous chunk can fail
  # to clear its breakpoints on the later attaches of the sequence.
  "--connect-under-reset",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 300
target-dir = "target"
artifact-extension = ""

# THROWAWAY EXPERIMENT (revert) — u32x8 restored: full 3 carriers x 4 fixtures
# = 12 chunks again, re-running to compare against the 8-chunk drop.
[[case-sets.ed25519-cyccnt]]
name = "u32x8"
binary = "cyccnt-hardware"
features = ["carrier-u32x8"]
expected-suite = "ed25519-cyccnt"

# No per-case timeout override: each chunk is one fixture, so all inherit the
# profile's 300 s (5 min) limit.
[[case-sets.ed25519-cyccnt]]
name = "u32x16"
binary = "cyccnt-hardware"
features = ["carrier-u32x16"]
expected-suite = "ed25519-cyccnt"

[[case-sets.ed25519-cyccnt]]
name = "u8x32"
binary = "cyccnt-hardware"
features = ["carrier-u8x32"]
expected-suite = "ed25519-cyccnt"

[campaigns.ed25519-ct-jtrace-f407]
profile = "jtrace-f407"
case-set = "ed25519-cyccnt"
# Expand the three carrier cases across the fixture axis so each
# (carrier, fixture) pair — 12 in all — measures in its own probe-rs session.
# A fresh session per fixture keeps cross-fixture probe/bus state from
# perturbing a later fixture's first timed samples; each pair is independently
# gated with its own negative control.
matrix = { fixture = ["keygen", "sign", "x25519", "x25519-base"] }
matrix-features = ["fix-{fixture}"]
# Gating: the positive classes must stay under the Welch threshold and the
# negative control must exceed it, so this catches a systematic A/B bias that
# stays under the on-device 32-cycle spread bound yet is statistically distinct.
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = true }
