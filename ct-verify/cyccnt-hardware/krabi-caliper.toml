[profiles.jtrace-f407]
runner = "command"
target = "thumbv7em-none-eabihf"
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "${KRABI_PROBE}"
clock-frequency-hz = 16000000
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "${KRABI_PROBE}",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_SUMMARY"
completion-action = "interrupt"
timeout-seconds = 300
target-dir = "target"
artifact-extension = ""

[[case-sets.ed25519-cyccnt]]
name = "u32x8"
binary = "cyccnt-hardware"
features = ["carrier-u32x8"]
expected-suite = "ed25519-cyccnt"

[[case-sets.ed25519-cyccnt]]
name = "u32x16"
binary = "cyccnt-hardware"
features = ["carrier-u32x16"]
expected-suite = "ed25519-cyccnt"
timeout-seconds = 1800

[[case-sets.ed25519-cyccnt]]
name = "u8x32"
binary = "cyccnt-hardware"
features = ["carrier-u8x32"]
expected-suite = "ed25519-cyccnt"
timeout-seconds = 1800

[campaigns.ed25519-ct-jtrace-f407]
profile = "jtrace-f407"
case-set = "ed25519-cyccnt"
# Gating: the positive classes must stay under the Welch threshold and the
# negative control must exceed it, so this catches a systematic A/B bias that
# stays under the on-device 32-cycle spread bound yet is statistically distinct.
constant-time = { welch-threshold = 4.5, minimum-samples-per-class = 4, protected-classes = ["positive"], control-classes = ["negative"], gate = true }
