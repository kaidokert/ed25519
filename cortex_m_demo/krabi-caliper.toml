[profiles.qemu-cortex-m0]
preset = "qemu-cortex-m0"
timeout-seconds = 120

[profiles.qemu-cortex-m3]
preset = "qemu-cortex-m3"
timeout-seconds = 120

[profiles.qemu-cortex-m4]
preset = "qemu-cortex-m4"
timeout-seconds = 120

[profiles.qemu-cortex-m3-external]
runner = "command"
target = "thumbv7m-none-eabi"
board = "qemu-lm3s6965evb"
mcu = "lm3s6965"
transport = "semihosting"
build-features = ["external-measurement"]
executable = "../../krabi-caliper/target/debug/cargo-krabi-caliper"
args = [
  "timestamp-command",
  "qemu-system-arm",
  "--",
  "-cpu", "cortex-m3",
  "-machine", "lm3s6965evb",
  "-nographic",
  "-semihosting-config", "enable=on,target=native",
  "-kernel", "{artifact}",
]
require-external-measurements = true
timeout-seconds = 30
artifact-extension = ""

[profiles.jtrace-f407]
runner = "command"
target = "thumbv7em-none-eabihf"
board = "jtrace-reference-board"
mcu = "STM32F407VG"
transport = "rtt"
probe = "1366:1020:001224000224"
clock-frequency-hz = 16000000
build-features = ["jtrace-f407"]
executable = "probe-rs"
args = [
  "run",
  "--chip", "STM32F407VGTx",
  "--protocol", "swd",
  "--probe", "1366:1020:001224000224",
  "--non-interactive",
  "--disable-progressbars",
  "--no-location",
  "{artifact}",
]
completion-marker = "EM_OUTCOME"
completion-action = "interrupt"
timeout-seconds = 120
artifact-extension = ""

[[case-sets.ed25519-footprint]]
name = "ed25519-u8-baseline"
example = "ed25519_u8"
features = ["baseline"]
expected-benchmark = "ed25519-footprint"

[[case-sets.ed25519-footprint]]
name = "ed25519-u8-verify"
example = "ed25519_u8"
