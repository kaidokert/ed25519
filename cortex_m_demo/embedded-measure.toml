baseline = "x25519-u8-baseline"

[[case-sets.ed25519-footprint]]
name = "x25519-u32-baseline"
example = "x25519_u32"
features = ["baseline"]
expected-benchmark = "ed25519-footprint"

[[case-sets.ed25519-footprint]]
