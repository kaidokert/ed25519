[package]
name = "cortex_m_demo"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.5"
panic-halt = "1"

ed25519_heapless = { path = "../ed25519", default-features = false, features = [
    "fixed-bigint",
    "fixed-bigint-u8",
] }
fixed-bigint = { version = "0.2.5", features = ["use-unsafe"] }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "s"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
