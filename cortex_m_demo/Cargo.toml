[package]
name = "cortex_m_demo"
version = "0.1.0"
edition = "2024"
autobins = false
autotests = false
autobenches = false

[features]
baseline = []
external-measurement = []
jtrace-f407 = ["cortex-m/critical-section-single-core", "embedded-measure/rtt"]

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-measure = { version = "0.1.0", features = ["stack", "cortex-m", "semihosting"] }
cortex-m-semihosting = "0.5"
panic-semihosting = { version = "0.6", features = ["exit"] }

ed25519_heapless = { path = "../ed25519", default-features = false, features = [
    "fixed-bigint",
    "fixed-bigint-u8",
    "sha512-hmac-sha512",
] }
fixed-bigint = { version = "0.5", default-features = false, features = ["use-unsafe", "zeroize", "cios"] }
const-num-traits = { version = "0.2", default-features = false }

[patch.crates-io]
embedded-measure = { path = "../../embedded-measure" }

[profile.release]
codegen-units = 1
debug = true
lto = true
opt-level = "z"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(thumbv6m)',
    'cfg(thumbv7m)',
    'cfg(thumbv7em)',
] }
