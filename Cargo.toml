[package]
name = "ed25519"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = []

[dependencies]
fixed-bigint = { version = "0.1", features = ["use-unsafe"] }
modmath = { version = "0.1", default-features = false }
num-traits = { version = "0.2", default-features = false }
hmac-sha512 = "1"

[dev-dependencies]
ed25519-dalek = "2"
