[workspace]
resolver = "2"

members = [ "ed25519" ]
exclude = [ "avr_demo", "cortex_m_demo", "riscv_demo", "ct-verify" ]

# Experimental: pin modmath to the v0.6.1-alpha.1 tag to pick up
# SchoolbookFieldRef (the Clone/by-reference vartime field) for the
# non-Copy heap-carrier verify path. Tag declares version 0.6.0, so the
# crates.io version requirement resolves against it.
[patch.crates-io]
modmath = { git = "https://github.com/kaidokert/modmath-rs.git", tag = "v0.6.1-alpha.1" }
